services:
  hapi-fhir-jpaserver-start:
    # Using pre-built image because Docker build has SSL certificate issues in this build environment
    # For local builds, change to "build: ." to build from source
    image: hapiproject/hapi:latest
    container_name: hapi-fhir-jpaserver-start
    restart: on-failure
    environment:
      SPRING_CONFIG_LOCATION: 'file:///data/hapi/application.yml'
    volumes:
      - ./hapi_config:/data/hapi
      - ./web_content:/custom
      - ./apps:/apps
    ports:
      - "8080:8080"
    depends_on:
      hapi-fhir-postgres:
        condition: service_healthy
  hapi-fhir-postgres:
    image: postgres:16-alpine
    container_name: hapi-fhir-postgres
    restart: always
    environment:
      POSTGRES_DB: "hapi"
      POSTGRES_USER: "admin"
      POSTGRES_PASSWORD: "admin"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U admin -d hapi' || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    volumes:
      - hapi-fhir-postgres:/var/lib/postgresql/data

volumes:
  hapi-fhir-postgres:
