version: '3.7'
services:
  fhir-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: terminology-server
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://db:5432/hapi'
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      HAPI_FHIR_FHIR_VERSION: R5
      HAPI_FHIR_CUSTOM_CONTENT_PATH: /app/custom/
      HAPI_FHIR_APP_CONTENT_PATH: /app/configs/
    depends_on:
      - db
  db:
    image: postgres:13-alpine
    restart: always
    container_name: terminology-database
    volumes:
      - ./data/db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=hapi
      - POSTGRES_ROOT_PASSWORD=admin
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
